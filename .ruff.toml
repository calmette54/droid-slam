# Ruff settings for `bazelisk run //:format` (formatter) and
# //test/lint:ruff_test (linter). https://docs.astral.sh/ruff/settings/
line-length = 100
target-version = "py312"

# Code imported from upstream DROID-SLAM stays as-is (see UPSTREAM.md), also
# when the files are passed explicitly (pre-commit, format_multirun).
force-exclude = true
extend-exclude = [
    "droid_slam",
    "evaluation_scripts",
    "demo.py",
    "train.py",
    "view_reconstruction.py",
    "third_party/tartanair_tools",
]

[lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.isort]
# Modules built in this repository (imported by their top-level name).
known-first-party = ["_droid_backends", "droid_backends"]
